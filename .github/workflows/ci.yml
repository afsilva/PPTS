name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Set fixed supply-chain policy time
        run: echo "POLICY_NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Enforce package cooling-off and deprecation policy before install
        run: node scripts/check-npm-supply-chain.mjs
      - name: Reject mutable CI action references before install
        run: node scripts/check-ci-action-pins.mjs
      - name: Extract dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Reject every known dependency vulnerability
        run: npm audit --audit-level=low
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:contract
      - run: npm run build
      - name: Build hardened container
        run: docker build --target runner -t ppts:${{ github.sha }} .

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
        env:
          POSTGRES_DB: ppts_test
          POSTGRES_USER: ppts_test
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppts_test -d ppts_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ppts_test:integration-only-password@127.0.0.1:5432/ppts_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Extract dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply all migrations to an empty database
        run: npm run db:deploy
      - name: Run real-PostgreSQL regression and concurrency tests
        run: npm run test:integration
