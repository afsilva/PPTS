name: ppts

# Image digests are the reviewed multi-architecture manifest indexes for the
# exact version tags, so builds stay reproducible and pull from either
# architecture. Keycloak is pinned the same way (quay.io list digest).
services:
  db:
    image: docker.io/library/postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    restart: unless-stopped
    environment:
      POSTGRES_DB: ppts
      POSTGRES_USER: ppts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: ["ppts-db:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppts -d ppts"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]
    cap_drop: ["ALL"]
    # The official PostgreSQL entrypoint starts as root only long enough to
    # prepare the named volume/socket directory, then drops to `postgres`.
    # These are the minimum capabilities needed for that initialization.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 256
    cpus: 1.0

  keycloak-db:
    image: docker.io/library/postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes: ["ppts-keycloak-db:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [identity-data]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 256
    cpus: 1.0

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HTTP_ENABLED: "true"
      JAVA_OPTS_APPEND: -XX:UseSVE=0
      KC_FEATURES_DISABLED: identity-brokering-api,twitter-broker
      KC_SPI_STICKY_SESSION_ENCODER_INFINISPAN_SHOULD_ATTACH_ROUTE: "false"
    volumes:
      - ./keycloak/ppts-realm.json:/opt/keycloak/data/import/ppts-realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    # `start-dev` performs Quarkus augmentation under /opt/keycloak/lib at
    # startup, so this upstream image cannot use a read-only root filesystem.
    # It still runs as Keycloak's non-root user with no capabilities, no-new-
    # privileges, isolated networks, no host filesystem writes, and limits.
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [identity, identity-data]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    pids_limit: 512
    cpus: 2.0

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    entrypoint: ["/bin/sh", "/bootstrap/reconcile-realm.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: local-admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KEYCLOAK_ALEX_PASSWORD: ${KEYCLOAK_ALEX_PASSWORD:?KEYCLOAK_ALEX_PASSWORD is required}
      KEYCLOAK_CASEY_PASSWORD: ${KEYCLOAK_CASEY_PASSWORD:?KEYCLOAK_CASEY_PASSWORD is required}
      KEYCLOAK_MORGAN_PASSWORD: ${KEYCLOAK_MORGAN_PASSWORD:?KEYCLOAK_MORGAN_PASSWORD is required}
      PPTS_PORT: ${PPTS_PORT:-3000}
      KC_OPTS: -XX:UseSVE=0
    volumes:
      - ./keycloak/reconcile-realm.sh:/bootstrap/reconcile-realm.sh:ro
    depends_on:
      keycloak: { condition: service_healthy }
    networks: [identity]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /opt/keycloak/.keycloak:size=1m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    cpus: 0.5

  migrate:
    build: { context: ., target: builder }
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://ppts:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/ppts
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    restart: "no"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    cpus: 1.0

  seed:
    build: { context: ., target: builder }
    command: ["npm", "run", "db:seed"]
    environment:
      DATABASE_URL: postgresql://ppts:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/ppts
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [data]
    restart: "no"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    cpus: 1.0

  document-storage-init:
    image: docker.io/library/node:24.13.1-bookworm-slim@sha256:a81a03dd965b4052269a57fac857004022b522a4bf06e7a739e25e18bce45af2
    command:
      [
        "sh",
        "-c",
        "mkdir -p /var/lib/ppts-documents/quarantine /var/lib/ppts-documents/clean && chown -R 1001:1001 /var/lib/ppts-documents",
      ]
    volumes: ["ppts-documents:/var/lib/ppts-documents"]
    restart: "no"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 32
    cpus: 0.25

  clamav:
    image: docker.io/clamav/clamav-debian:1.5.1@sha256:c102cd8fffe36fb27808a714f2d9c977e28549b3aae1ea0de7d7ac7814f8ded7
    restart: unless-stopped
    volumes: ["ppts-clamav-definitions:/var/lib/clamav"]
    networks: [document-scan]
    cap_drop: ["ALL"]
    # The upstream entrypoint initializes the named definitions volume before
    # dropping privileges; these are the minimum filesystem/user capabilities.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    pids_limit: 256
    cpus: 2.0
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s

  document-worker:
    build: { context: ., target: document-worker }
    restart: unless-stopped
    command:
      [
        "node",
        "--conditions",
        "react-server",
        "--import",
        "./tests/setup/node-exports-shim.mjs",
        "--import",
        "tsx",
        "src/workers/documents.ts",
      ]
    environment:
      DATABASE_URL: postgresql://ppts:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/ppts
      DOCUMENT_STORAGE_ROOT: /var/lib/ppts-documents
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-5242880}
      DOCUMENT_PROJECT_MAX_BYTES: ${DOCUMENT_PROJECT_MAX_BYTES:-104857600}
      DOCUMENT_PROJECT_MAX_COUNT: ${DOCUMENT_PROJECT_MAX_COUNT:-500}
      DOCUMENT_RETENTION_DAYS: ${DOCUMENT_RETENTION_DAYS:-0}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_MS: 30000
    volumes: ["ppts-documents:/var/lib/ppts-documents"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      document-storage-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
    networks: [data, document-scan]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256
    cpus: 1.0

  maintenance:
    build: { context: ., target: maintenance }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ppts:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/ppts
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-86400}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [data]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    cpus: 0.25

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ppts:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/ppts
      APP_ORIGIN: http://localhost:${PPTS_PORT:-3000}
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/ppts
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/ppts
      OIDC_CLIENT_ID: ppts-local
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ORGANIZATION_TIME_ZONE: ${ORGANIZATION_TIME_ZONE:-UTC}
      DOCUMENT_STORAGE_ROOT: /var/lib/ppts-documents
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-5242880}
      DOCUMENT_PROJECT_MAX_BYTES: ${DOCUMENT_PROJECT_MAX_BYTES:-104857600}
      DOCUMENT_PROJECT_MAX_COUNT: ${DOCUMENT_PROJECT_MAX_COUNT:-500}
      DOCUMENT_RETENTION_DAYS: ${DOCUMENT_RETENTION_DAYS:-0}
    volumes:
      - ppts-documents:/var/lib/ppts-documents
    ports:
      - "127.0.0.1:${PPTS_PORT:-3000}:3000"
    depends_on:
      seed: { condition: service_completed_successfully }
      keycloak-bootstrap: { condition: service_completed_successfully }
      document-storage-init: { condition: service_completed_successfully }
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=64m,mode=0777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [data, identity]
    mem_limit: 512m
    pids_limit: 256
    cpus: 1.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

# Trust-boundary segmentation:
# - data: internal only; PPTS application database + app + migrator.
# - identity-data: internal only; Keycloak database + Keycloak.
# - identity: routed (browser-facing Keycloak on 127.0.0.1) shared by app and
#   Keycloak for token/JWKS/health calls. Databases are unreachable from the
#   routed network, so a published port cannot expose a database.
# - document-scan: internal-only worker-to-ClamAV channel. The app and browser
#   cannot reach clamd; quarantined bytes are never served.
networks:
  data:
    internal: true
  identity-data:
    internal: true
  identity:
  document-scan:
    internal: true

volumes:
  ppts-db:
  ppts-keycloak-db:
  ppts-documents:
  ppts-clamav-definitions:
